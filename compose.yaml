services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-commerce}
      POSTGRES_USER: ${POSTGRES_USER:-commerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-commerce}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-commerce}:${POSTGRES_PASSWORD:-commerce}@db:5432/${POSTGRES_DB:-commerce}
      OBSERVABILITY_LEVEL: ${OBSERVABILITY_LEVEL:-basic}
      SEED_CATALOG: ${SEED_CATALOG:-true}
      LOG_FILE: /app/logs/app.jsonl
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-30}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-30}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
      - ./artifacts:/app/artifacts
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=2)",
        ]
      interval: 3s
      timeout: 3s
      retries: 40
    restart: unless-stopped

  test-db:
    image: postgres:16
    profiles: ["test"]
    environment:
      POSTGRES_DB: commerce_test
      POSTGRES_USER: commerce_test
      POSTGRES_PASSWORD: commerce_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerce_test -d commerce_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  test:
    build: .
    profiles: ["test"]
    environment:
      DATABASE_URL: postgresql+psycopg://commerce_test:commerce_test@test-db:5432/commerce_test
      OBSERVABILITY_LEVEL: basic
      LOG_FILE: /tmp/fault-commerce-test.jsonl
      BASE_URL: http://127.0.0.1:8000
    depends_on:
      test-db:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && pytest -q"]

volumes:
  postgres-data:

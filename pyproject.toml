[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fault-commerce-lab"
version = "1.0.0"
description = "Verified L1 commerce baseline for reliability experiments"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.16.4",
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "prometheus-client==0.22.1",
  "psycopg[binary]==3.2.9",
  "pydantic-settings==2.10.1",
  "sqlalchemy==2.0.43",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
  "mypy==1.17.1",
  "pytest==8.4.1",
  "ruff==0.12.8",
]

[tool.setuptools.packages.find]
include = ["app*", "oracle*", "scripts*", "tools*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: tests that require PostgreSQL",
  "live_http: tests that start a real HTTP server",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["artifacts", "build", "logs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true
exclude = ["tests/", "alembic/"]
